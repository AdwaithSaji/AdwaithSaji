<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Adwaith Sajikumar — computer science, AI and systems</title>
  <desc id="d">Name banner beside an isometric stack of five layers — edge, infrastructure, services, models and agents — with a signal rising through them, lighting each layer in turn.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#0f161e" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="860" cy="196" r="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fe0ee" stop-opacity=".14"/>
      <stop offset="1" stop-color="#3fe0ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#07090c" stop-opacity=".92"/>
      <stop offset=".5" stop-color="#07090c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#07090c" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="380" rx="14"/></clipPath>
    <path id="spine" d="M860 304V88"/>
  </defs>

  <style>
    .sans { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace; }
    .face { fill: #0a1317; stroke: #2a6d75; stroke-width: 1.1; stroke-linejoin: round; }
    .inner { fill: none; stroke: #15303a; stroke-width: 1; }
    .side-l { fill: #070d10; stroke: #1a3a41; stroke-width: 1; stroke-linejoin: round; }
    .side-r { fill: #091216; stroke: #1a3a41; stroke-width: 1; stroke-linejoin: round; }
    .lead { stroke: #26414a; stroke-width: 1; }
    .name { font-size: 11.5px; fill: #c3ccd6; letter-spacing: .14em; }
    .sub { font-size: 10.5px; fill: #56636f; letter-spacing: .04em; }
    .hl { stroke-width: 1.4; opacity: 0; animation: lit 5s linear infinite; }
    .hl.c { fill: rgba(63, 224, 238, .13); stroke: #3fe0ee; }
    .hl.v { fill: rgba(169, 155, 242, .15); stroke: #a99bf2; }
    .d0 { animation-delay: 0s; } .d1 { animation-delay: 1s; } .d2 { animation-delay: 2s; }
    .d3 { animation-delay: 3s; } .d4 { animation-delay: 4s; }
    @keyframes lit { 0% { opacity: 0; } 3% { opacity: 1; } 22% { opacity: 0; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } .hl { animation: none; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="#07090c"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>
    <rect width="700" height="380" fill="url(#fade)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="379" rx="14" fill="none" stroke="#1a222d"/>

  <!-- registration marks -->
  <g stroke="#2a3542" stroke-width="1.2" fill="none">
    <path d="M28 44V28H44M1156 28H1172V44M1172 336V352H1156M44 352H28V336"/>
  </g>

  <!-- identity -->
  <text class="mono" x="64" y="66" font-size="12" fill="#4a5664" letter-spacing=".12em">~/AdwaithSaji</text>
  <text class="mono" x="64" y="128" font-size="13" fill="#3fe0ee" letter-spacing=".22em">COMPUTER SCIENCE · AI · SYSTEMS</text>
  <text class="sans" x="62" y="190" font-size="58" font-weight="600" fill="#e8edf2" letter-spacing="-.01em">Adwaith Sajikumar</text>
  <text class="sans" x="64" y="232" font-size="20" fill="#8b97a5">Engineering across the stack, from edge devices to AI agents.</text>
  <g class="mono" font-size="12.5" fill="#5b6878">
    <text x="64" y="282">study&#160;&#160;<tspan fill="#9aa6b3">computer science engineering · Karunya, Coimbatore</tspan></text>
    <text x="64" y="304">build&#160;&#160;<tspan fill="#9aa6b3">edge AI · LLM agents · vision · backends · cloud</tspan></text>
  </g>

  <!-- layer stack, bottom (edge) to top (agents) -->
  <g>
    <polygon points="742,304 860,334 860,341 742,311" class="side-l"/><polygon points="860,334 978,304 978,311 860,341" class="side-r"/>
    <polygon points="860,274 978,304 860,334 742,304" class="face"/><polygon points="860,284 944,304 860,324 776,304" class="inner"/>
    <polygon points="860,274 978,304 860,334 742,304" class="hl c d0"/>
    <path d="M978 304H996" class="lead"/>
    <text x="1002" y="305" class="mono name">01&#160;&#160;EDGE</text>
    <text x="1002" y="320" class="mono sub">fogai · iiot</text>
  </g>
  <g>
    <polygon points="742,250 860,280 860,287 742,257" class="side-l"/><polygon points="860,280 978,250 978,257 860,287" class="side-r"/>
    <polygon points="860,220 978,250 860,280 742,250" class="face"/><polygon points="860,230 944,250 860,270 776,250" class="inner"/>
    <polygon points="860,220 978,250 860,280 742,250" class="hl c d1"/>
    <path d="M978 250H996" class="lead"/>
    <text x="1002" y="251" class="mono name">02&#160;&#160;INFRA</text>
    <text x="1002" y="266" class="mono sub">k8s · terraform · ci</text>
  </g>
  <g>
    <polygon points="742,196 860,226 860,233 742,203" class="side-l"/><polygon points="860,226 978,196 978,203 860,233" class="side-r"/>
    <polygon points="860,166 978,196 860,226 742,196" class="face"/><polygon points="860,176 944,196 860,216 776,196" class="inner"/>
    <polygon points="860,166 978,196 860,226 742,196" class="hl c d2"/>
    <path d="M978 196H996" class="lead"/>
    <text x="1002" y="197" class="mono name">03&#160;&#160;SERVICES</text>
    <text x="1002" y="212" class="mono sub">spring · fastapi</text>
  </g>
  <g>
    <polygon points="742,142 860,172 860,179 742,149" class="side-l"/><polygon points="860,172 978,142 978,149 860,179" class="side-r"/>
    <polygon points="860,112 978,142 860,172 742,142" class="face"/><polygon points="860,122 944,142 860,162 776,142" class="inner"/>
    <polygon points="860,112 978,142 860,172 742,142" class="hl c d3"/>
    <path d="M978 142H996" class="lead"/>
    <text x="1002" y="143" class="mono name">04&#160;&#160;MODELS</text>
    <text x="1002" y="158" class="mono sub">vision · medical ai</text>
  </g>
  <g>
    <polygon points="742,88 860,118 860,125 742,95" class="side-l"/><polygon points="860,118 978,88 978,95 860,125" class="side-r"/>
    <polygon points="860,58 978,88 860,118 742,88" class="face"/><polygon points="860,68 944,88 860,108 776,88" class="inner"/>
    <polygon points="860,58 978,88 860,118 742,88" class="hl v d4"/>
    <path d="M978 88H996" class="lead"/>
    <text x="1002" y="89" class="mono name">05&#160;&#160;AGENTS</text>
    <text x="1002" y="104" class="mono sub">llm research agent</text>
  </g>

  <!-- signal rising through the stack -->
  <use href="#spine" stroke="#1d4a50" stroke-width="1" stroke-dasharray="2 5" fill="none"/>
  <g class="motion" filter="url(#soft)">
    <circle r="3" fill="#3fe0ee" opacity="0">
      <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.8;1" calcMode="linear"><mpath href="#spine"/></animateMotion>
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.03;.78;.84;1"/>
      <animate attributeName="fill" dur="5s" repeatCount="indefinite" values="#3fe0ee;#3fe0ee;#a99bf2;#a99bf2" keyTimes="0;.6;.75;1"/>
    </circle>
  </g>

  <!-- baseline -->
  <path d="M64 352H700" stroke="#141b23"/>
</svg>
